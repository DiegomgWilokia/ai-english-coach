<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e20" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="English Coach" />
<title>AI English Coach</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="favicon.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar" hidden>
    <a href="#/dashboard" class="brand">
      <img class="brand-logo" src="icon-192.png" alt="" />
      <span class="brand-name">AI English <b>Coach</b></span>
    </a>
    <nav class="nav" id="side-nav"></nav>
    <div class="side-foot">
      <div id="side-rank"></div>
      <div class="lang-toggle" id="lang-side"></div>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar" id="topbar" hidden>
      <a href="#/dashboard" class="brand">
        <img class="brand-logo" src="icon-192.png" alt="" />
        <span class="brand-name">AI English <b>Coach</b></span>
      </a>
      <div class="topbar-right">
        <span id="level-chip" class="chip-level" hidden></span>
        <a href="#/profile" class="avatar-btn" id="top-avatar">👤</a>
      </div>
    </header>

    <main id="view" class="view"></main>
  </div>

  <nav id="tabbar" class="tabbar" hidden></nav>

  <div id="loader" class="loader-overlay" hidden>
    <div class="loader-box">
      <div class="orbit"><span></span><span></span><span></span></div>
      <p id="loader-text">…</p>
    </div>
  </div>

  <div id="modal" class="modal-overlay" hidden>
    <div class="modal-card" id="modal-card"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/ui.js"></script>
</body>
</html>
